<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Bank 3</title>
    <style>
        :root {
            --bg-main: #070b14;
            --bg-card: #101829;
            --bg-pill: #18233b;
            --gold: #f6cf68;
            --gold-bright: #ffe499;
            --purple: #9333ea;
            --purple-soft: #d8b4fe;
            --text: #ffffff;
            --sub: #a8b4c9;
            --line: rgba(147, 51, 234, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #181033 0%, var(--bg-main) 65%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .frame {
            width: 100%;
            max-width: 480px;
            background: rgba(16, 24, 41, 0.92);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 26px 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 32px rgba(147, 51, 234, 0.22);
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .id-badge {
            font-size: 13px;
            font-weight: 700;
            color: var(--purple-soft);
            background: rgba(147, 51, 234, 0.18);
            border: 1px solid rgba(216, 180, 254, 0.4);
            padding: 6px 12px;
            border-radius: 999px;
        }

        .ref-badge {
            font-size: 12px;
            font-weight: 600;
            color: var(--gold);
        }

        .hero {
            text-align: center;
            padding: 12px 0 26px;
        }

        .brand {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 30%, var(--gold) 85%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .lead {
            font-size: 15px;
            color: var(--sub);
            margin-bottom: 28px;
        }

        .go-btn {
            width: 100%;
            padding: 18px 24px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--gold), #dfa928);
            color: #090d16;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(246, 207, 104, 0.32);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .go-btn:hover {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            transform: translateY(-2px);
            box-shadow: 0 16px 36px rgba(246, 207, 104, 0.48);
        }

        .go-btn:active {
            transform: translateY(1px);
        }

        .layer-box {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 18px;
        }

        .toggle-btn {
            width: 100%;
            background: var(--bg-pill);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .toggle-btn:hover {
            border-color: var(--purple-soft);
        }

        .modules-panel {
            display: none;
            margin-top: 12px;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .modules-panel.open {
            display: grid;
        }

        .mod-btn {
            background: #0b111e;
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 12px;
            padding: 12px 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .mod-btn:hover {
            border-color: var(--gold);
            background: rgba(147, 51, 234, 0.16);
        }

        .info-box {
            display: none;
            margin-top: 12px;
            background: rgba(147, 51, 234, 0.14);
            border: 1px solid rgba(216, 180, 254, 0.35);
            border-radius: 12px;
            padding: 14px;
            font-size: 13px;
            line-height: 1.5;
            color: #f3e8ff;
        }

        .info-box.show {
            display: block;
        }

        .foot {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--sub);
        }

        .foot a {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            margin-left: 12px;
        }
    </style>
</head>
<body>
    <main class="frame">
        <div class="top-row">
            <span class="id-badge">ID: ljw2358</span>
            <span class="ref-badge">추천인 ljw2358 · UBI 우선</span>
        </div>

        <section class="hero">
            <h1 class="brand">HK Bank 3</h1>
            <p class="lead">단순하고 빠르게, 세련된 금융 진입</p>
            <button type="button" class="go-btn" onclick="enterBank()">
                초고속 진입하기
            </button>
        </section>

        <section class="layer-box">
            <button type="button" class="toggle-btn" onclick="toggleModules()">
                <span>10대 핵심 모듈 펼치기</span>
                <span id="arrow">+</span>
            </button>

            <div class="modules-panel" id="modulesPanel">
                <button type="button" class="mod-btn" onclick="selectModule('지갑 연결')">지갑 연결</button>
                <button type="button" class="mod-btn" onclick="selectModule('송금')">송금</button>
                <button type="button" class="mod-btn" onclick="selectModule('결제')">결제</button>
                <button type="button" class="mod-btn" onclick="selectModule('예치')">예치</button>
                <button type="button" class="mod-btn" onclick="selectModule('보상')">보상</button>
                <button type="button" class="mod-btn" onclick="selectModule('기본소득 (UBI)')">기본소득 (UBI)</button>
                <button type="button" class="mod-btn" onclick="selectModule('스왑')">스왑</button>
                <button type="button" class="mod-btn" onclick="selectModule('덱스 스왑')">덱스 스왑</button>
                <button type="button" class="mod-btn" onclick="selectModule('LP 스테이킹')">LP 스테이킹</button>
                <button type="button" class="mod-btn" onclick="selectModule('파이 수량')">파이 수량</button>
            </div>

            <div class="info-box" id="infoBox"></div>
        </section>

        <footer class="foot">
            <span>&copy; 2026 HKWB</span>
            <div>
                <a href="https://www.youtube.com/@Hyekong2026" target="_blank" rel="noopener noreferrer">YouTube</a>
                <a href="https://www.tiktok.com/@Hyekong2026" target="_blank" rel="noopener noreferrer">TikTok</a>
            </div>
        </footer>
    </main>

    <script>
        function enterBank() {
            window.location.href = "https://hkwb.world";
        }

        function toggleModules() {
            const panel = document.getElementById("modulesPanel");
            const arrow = document.getElementById("arrow");
            const isOpen = panel.classList.toggle("open");
            arrow.textContent = isOpen ? "-" : "+";
        }

        function selectModule(name) {
            const box = document.getElementById("infoBox");
            box.innerHTML = "<strong>" + name + "</strong> 선택됨 · KYC/KYB 인증 및 Mainnet/Testnet 연결 대기 중입니다.";
            box.classList.add("show");
        }
    </script>
</body>
</html>
