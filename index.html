<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKWB - 간편 인터넷 뱅킹</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #121929;
            --bg-input: #1a233a;
            --purple-neon: #9d4edd;
            --purple-glow: rgba(157, 78, 221, 0.4);
            --gold-primary: #f7d070;
            --gold-hover: #ffe29a;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --border-color: #2d3748;
            --radius-main: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 메인 컨테이너 */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-card);
            border-radius: var(--radius-main);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px var(--purple-glow);
            border: 1px solid rgba(157, 78, 221, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 영역 */
        header {
            padding: 20px;
            background: linear-gradient(135deg, #161f33 0%, #0d1322 100%);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-primary);
            letter-spacing: 1px;
        }

        .user-id-badge {
            background-color: rgba(157, 78, 221, 0.15);
            color: var(--purple-neon);
            border: 1px solid var(--purple-neon);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* 60개국 언어 선택기 */
        .lang-select-wrapper select {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        /* 메인 콘텐츠 영역 */
        .content {
            padding: 24px 20px;
            display: flex;
            flex-direction: flex-direction;
            gap: 20px;
            flex: 1;
        }

        /* 잔액 카트 카드 */
        .balance-card {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.2) 0%, rgba(20, 28, 47, 0.8) 100%);
            border: 1px solid rgba(247, 208, 112, 0.3);
            border-radius: 14px;
            padding: 20px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(157, 78, 221, 0.1);
        }

        .balance-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .balance-amount span {
            color: var(--gold-primary);
        }

        /* 메인 인터넷 뱅크 진입 버튼 */
        .btn-go-bank {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--gold-primary) 0%, #e6b800 100%);
            color: #000;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(247, 208, 112, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-go-bank:hover {
            background: linear-gradient(90deg, var(--gold-hover) 0%, var(--gold-primary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(247, 208, 112, 0.5);
        }

        /* 10대 핵심 모듈 그리드 */
        .module-section-title {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 12px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .module-btn {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .module-btn i {
            font-size: 18px;
            color: var(--purple-neon);
        }

        .module-btn span {
            font-size: 11px;
            font-weight: 500;
        }

        .module-btn:hover {
            border-color: var(--purple-neon);
            background-color: rgba(157, 78, 221, 0.1);
            transform: translateY(-2px);
        }

        /* 송금 입력 폼 */
        .transfer-form {
            background-color: rgba(26, 35, 58, 0.5);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-top: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-sub);
        }

        .form-group input {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--purple-neon);
        }

        /* 하단 소셜 및 푸터 */
        footer {
            padding: 16px 20px;
            background-color: #080c14;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .social-links {
            display: flex;
            gap: 12px;
        }

        .social-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-sub);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon.youtube:hover {
            color: #ff0000;
            border-color: #ff0000;
            background-color: rgba(255, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .social-icon.tiktok:hover {
            color: #00f2fe;
            border-color: #00f2fe;
            background-color: rgba(0, 242, 254, 0.1);
            transform: translateY(-2px);
        }

        .copyright {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* 모달 알림창 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--purple-neon);
            border-radius: 14px;
            padding: 24px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-content h3 {
            color: var(--gold-primary);
            margin-bottom: 12px;
        }

        .modal-content p {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-btn {
            background-color: var(--purple-neon);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 헤더 -->
        <header>
            <div class="header-title">
                <span class="logo-text">HKWB</span>
                <span class="user-id-badge">ID: ljw2358</span>
            </div>
            <div class="lang-select-wrapper">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="ko">한국어 (KO)</option>
                    <option value="en">English (EN)</option>
                    <option value="ja">日本語 (JA)</option>
                    <option value="zh">中文 (ZH)</option>
                    <option value="es">Español (ES)</option>
                    <option value="vi">Tiếng Việt (VI)</option>
                    <!-- 60개국 언어 지원 생략 확장 가능 -->
                </select>
            </div>
        </header>

        <!-- 메인 콘텐츠 -->
        <div class="content">
            <!-- 잔액 및 이동 카드 -->
            <div class="balance-card">
                <div class="balance-header">
                    <span>HKWB 간편 잔액</span>
                    <span>추천인: ljw2358 (UBI 30%)</span>
                </div>
                <div class="balance-amount">
                    <span>1,250,000</span> KRW
                </div>
                <!-- 인터넷 뱅크 진입 버튼 (Line 451 이동 로직 포함) -->
                <button class="btn-go-bank" onclick="goBank(event)">
                    <i class="fa-solid fa-building-columns"></i> 인터넷 뱅크 진입하기
                </button>
            </div>

            <!-- 10대 핵심 분산 연동망 모듈 -->
            <div class="module-section-title">
                <span>10대 핵심 모듈 연동</span>
                <span style="font-size:11px; color:var(--purple-neon);">Mainnet / Testnet</span>
            </div>
            <div class="module-grid">
                <button class="module-btn" onclick="openModule('지갑 연결')">
                    <i class="fa-solid fa-wallet"></i>
                    <span>지갑</span>
                </button>
                <button class="module-btn" onclick="openModule('송금')">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>송금</span>
                </button>
                <button class="module-btn" onclick="openModule('결제')">
                    <i class="fa-solid fa-credit-card"></i>
                    <span>결제</span>
                </button>
                <button class="module-btn" onclick="openModule('예치')">
                    <i class="fa-solid fa-vault"></i>
                    <span>예치</span>
                </button>
                <button class="module-btn" onclick="openModule('보상')">
                    <i class="fa-solid fa-gift"></i>
                    <span>보상</span>
                </button>
                <button class="module-btn" onclick="openModule('기본소득 (UBI)')">
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                    <span>UBI</span>
                </button>
                <button class="module-btn" onclick="openModule('스왑')">
                    <i class="fa-solid fa-right-left"></i>
                    <span>스왑</span>
                </button>
                <button class="module-btn" onclick="openModule('DEX 스왑')">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>DEX</span>
                </button>
                <button class="module-btn" onclick="openModule('LP 스테이킹')">
                    <i class="fa-solid fa-coins"></i>
                    <span>LP</span>
                </button>
                <button class="module-btn" onclick="openModule('파이 수량 확인')">
                    <i class="fa-solid fa-cubes"></i>
                    <span>파이</span>
                </button>
            </div>

            <!-- 간편 송금 폼 -->
            <div class="transfer-form">
                <div class="form-group">
                    <label for="targetId">받는 분 또는 계좌 ID</label>
                    <input type="text" id="targetId" placeholder="예: ljw2358">
                </div>
                <div class="form-group">
                    <label for="amount">송금 금액</label>
                    <input type="number" id="amount" value="10000">
                </div>
            </div>
        </div>

        <!-- 푸터 영역 (소셜 미디어 포함) -->
        <footer>
            <div class="social-links">
                <a href="https://www.youtube.com/@Hyekong2026" target="_blank" class="social-icon youtube" title="YouTube Official">
                    <i class="fa-brands fa-youtube"></i>
                </a>
                <a href="https://www.tiktok.com/@Hyekong2026" target="_blank" class="social-icon tiktok" title="TikTok Official">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
            <div class="copyright">
                &copy; 2026 HKWB. All rights reserved.
            </div>
        </footer>
    </div>

    <!-- 모달 알림창 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3 id="modalTitle">모듈 안내</h3>
            <p id="modalDesc">선택한 모듈을 실행합니다.</p>
            <button class="modal-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        // Line 451: 인터넷 뱅크 진입 함수 (소문자 주소 적용)
        function goBank(e) {
            if (e) e.preventDefault();
            
            // 소문자 hkwb 사이트로 안전 이동
            window.location.href = "https://hkwb.world";
        }

        // 10대 모듈 대화상자 오픈
        function openModule(moduleName) {
            const title = document.getElementById("modalTitle");
            const desc = document.getElementById("modalDesc");
            
            title.innerText = moduleName + " 모듈";
            desc.innerHTML = `[${moduleName}] 연동이 호출되었습니다.<br>보안 KYC/KYB 인증 상태를 확인하는 중입니다.`;
            
            document.getElementById("modalOverlay").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modalOverlay").style.display = "none";
        }

        // 언어 변경 처리
        function changeLanguage(langCode) {
            console.log("Selected language: " + langCode);
        }
    </script>
</body>
</html>
