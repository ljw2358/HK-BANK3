<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKWB - 인터넷 뱅킹</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #121929;
            --bg-input: #1a233a;
            --purple-neon: #9d4edd;
            --purple-glow: rgba(157, 78, 221, 0.35);
            --gold-primary: #f7d070;
            --gold-hover: #ffe29a;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --border-color: #2d3748;
            --radius-main: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background-color: var(--bg-card);
            border-radius: var(--radius-main);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65), 0 0 24px var(--purple-glow);
            border: 1px solid rgba(157, 78, 221, 0.28);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px 20px;
            background: linear-gradient(135deg, #161f33 0%, #0d1322 100%);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--gold-primary);
            letter-spacing: 1px;
        }

        .user-id-badge {
            background-color: rgba(157, 78, 221, 0.16);
            color: #d8b4fe;
            border: 1px solid var(--purple-neon);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .lang-select-wrapper select {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        .content {
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .balance-card {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.2) 0%, rgba(20, 28, 47, 0.9) 100%);
            border: 1px solid rgba(247, 208, 112, 0.35);
            border-radius: 14px;
            padding: 20px;
            box-shadow: inset 0 0 16px rgba(157, 78, 221, 0.12);
        }

        .balance-header {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: var(--text-sub);
            font-size: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .balance-amount span {
            color: var(--gold-primary);
        }

        .btn-go-bank {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(90deg, var(--gold-primary) 0%, #e5b73b 100%);
            color: #0b0f19;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(247, 208, 112, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-go-bank:hover {
            background: linear-gradient(90deg, var(--gold-hover) 0%, var(--gold-primary) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(247, 208, 112, 0.45);
        }

        .module-section-title {
            font-size: 14px;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .module-btn {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 13px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }

        .module-btn i {
            font-size: 17px;
            color: #c084fc;
        }

        .module-btn span {
            font-size: 11px;
            font-weight: 600;
        }

        .module-btn:hover {
            border-color: var(--purple-neon);
            background-color: rgba(157, 78, 221, 0.16);
            transform: translateY(-2px);
        }

        .transfer-form {
            background-color: rgba(26, 35, 58, 0.55);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-sub);
        }

        .form-group input {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--purple-neon);
        }

        footer {
            padding: 16px 20px;
            background-color: #080c14;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .social-links {
            display: flex;
            gap: 10px;
        }

        .social-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-sub);
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .social-icon.youtube:hover {
            color: #ff4d4d;
            border-color: #ff4d4d;
            background-color: rgba(255, 77, 77, 0.12);
            transform: translateY(-2px);
        }

        .social-icon.tiktok:hover {
            color: #22d3ee;
            border-color: #22d3ee;
            background-color: rgba(34, 211, 238, 0.12);
            transform: translateY(-2px);
        }

        .copyright {
            font-size: 11px;
            color: var(--text-sub);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--purple-neon);
            border-radius: 14px;
            padding: 24px;
            max-width: 360px;
            width: 90%;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
        }

        .modal-content h3 {
            color: var(--gold-primary);
            margin-bottom: 10px;
        }

        .modal-content p {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .modal-btn {
            background-color: var(--purple-neon);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        @media (max-width: 460px) {
            .module-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-title">
                <span class="logo-text">HKWB</span>
                <span class="user-id-badge">ID: ljw2358</span>
            </div>
            <div class="lang-select-wrapper">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="ko">한국어 (KO)</option>
                    <option value="en">English (EN)</option>
                    <option value="ja">日本語 (JA)</option>
                    <option value="zh">中文 (ZH)</option>
                    <option value="es">Español (ES)</option>
                    <option value="vi">Tiếng Việt (VI)</option>
                </select>
            </div>
        </header>

        <div class="content">
            <div class="balance-card">
                <div class="balance-header">
                    <span>HKWB 간편 잔액</span>
                    <span>추천인: ljw2358 (UBI 30%)</span>
                </div>
                <div class="balance-amount">
                    <span>1,250,000</span> KRW
                </div>
                <button type="button" class="btn-go-bank" onclick="goBank(event)">
                    <i class="fa-solid fa-building-columns"></i> 인터넷 뱅크 진입하기
                </button>
            </div>

            <div class="module-section-title">
                <span>10대 핵심 모듈 연동</span>
                <span style="font-size:11px; color:#c084fc;">Mainnet / Testnet</span>
            </div>

            <div class="module-grid">
                <button type="button" class="module-btn" onclick="openModule('지갑 연결')">
                    <i class="fa-solid fa-wallet"></i>
                    <span>지갑</span>
                </button>
                <button type="button" class="module-btn" onclick="openModule('송금')">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>송금</span>
                </button>
                <button type="button" class="module-btn" onclick="openModule('결제')">
                    <i class="fa-solid fa-credit-card"></i>
                    <span>결제</span>
                </button>
                <button type="button" class="module-btn" onclick="openModule('예치')">
                    <i class="fa-solid fa-vault"></i>
                    <span>예치</span>
                </button>
                <button type="button" class="module-btn" onclick="openModule('보상')">
                    <i class="fa-solid fa-gift"></i>
                    <span>보상</span>
                </button>
                <button type="button" class="module-btn" onclick="openModule('기본소득 (UBI)')">
                    <i class="fa-solid fa-hand-holding-dollar"></i>
                    <span>UBI</span>
                </button>
                <button type="button" class="module-btn" onclick="openModule('스왑')">
                    <i class="fa-solid fa-right-left"></i>
                    <span>스왑</span>
                </button>
                <button type="button" class="module-btn" onclick="openModule('DEX 스왑')">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>DEX</span>
                </button>
                <button type="button" class="module-btn" onclick="openModule('LP 스테이킹')">
                    <i class="fa-solid fa-coins"></i>
                    <span>LP</span>
                </button>
                <button type="button" class="module-btn" onclick="openModule('파이 수량 확인')">
                    <i class="fa-solid fa-cubes"></i>
                    <span>파이</span>
                </button>
            </div>

            <div class="transfer-form">
                <div class="form-group">
                    <label for="targetId">받는 분 또는 계좌 ID</label>
                    <input type="text" id="targetId" placeholder="예: ljw2358">
                </div>
                <div class="form-group">
                    <label for="amount">송금 금액</label>
                    <input type="number" id="amount" value="10000">
                </div>
            </div>
        </div>

        <footer>
            <div class="social-links">
                <a href="https://www.youtube.com/@Hyekong2026" target="_blank" rel="noopener noreferrer" class="social-icon youtube" title="YouTube Official">
                    <i class="fa-brands fa-youtube"></i>
                </a>
                <a href="https://www.tiktok.com/@Hyekong2026" target="_blank" rel="noopener noreferrer" class="social-icon tiktok" title="TikTok Official">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
            <div class="copyright">
                &copy; 2026 HKWB. All rights reserved.
            </div>
        </footer>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3 id="modalTitle">모듈 안내</h3>
            <p id="modalDesc">선택한 모듈을 실행합니다.</p>
            <button type="button" class="modal-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        const HKWB_BANK_URL = "https://hkwb.world";

        function goBank(e) {
            if (e) e.preventDefault();
            window.location.href = HKWB_BANK_URL;
        }

        function openModule(moduleName) {
            const title = document.getElementById("modalTitle");
            const desc = document.getElementById("modalDesc");
            title.innerText = moduleName + " 모듈";
            desc.innerHTML = `[${moduleName}] 연동이 호출되었습니다.<br>KYC/KYB 인증 및 둘러보기 상태를 확인하는 중입니다.`;
            document.getElementById("modalOverlay").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modalOverlay").style.display = "none";
        }

        function changeLanguage(langCode) {
            console.log("Selected language: " + langCode);
        }
    </script>
</body>
</html>
