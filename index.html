<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKWB 간편 뱅킹</title>
  <style>
    :root {
      --bg-main: #0b0f17;
      --bg-card: #151c28;
      --bg-card-sub: #1c2536;
      --gold: #facc15;
      --gold-soft: rgba(250, 204, 21, 0.14);
      --text-main: #ffffff;
      --text-sub: #9ca3af;
      --line: rgba(255, 255, 255, 0.08);
      --gold-line: rgba(250, 204, 21, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Pretendard", sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px 14px 86px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 상단 바 */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-hk {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--gold);
      color: #0b0f17;
      font-weight: 900;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
    }

    .id-chip {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid var(--gold-line);
      padding: 5px 10px;
      border-radius: 999px;
    }

    /* 메인 계좌 카드 */
    .account-card {
      background: linear-gradient(145deg, #1b2436 0%, var(--bg-card) 100%);
      border: 1px solid var(--gold-line);
      border-radius: 22px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .account-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .balance-amount {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--text-main);
    }

    .btn-transfer-pill {
      background: var(--bg-card-sub);
      color: var(--text-main);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-transfer-pill:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .cta-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 2px;
    }

    .btn-gold {
      background: var(--gold);
      color: #0b0f17;
      border: none;
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 0.92rem;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-gold:hover {
      filter: brightness(1.06);
    }

    .btn-dark {
      background: var(--bg-card-sub);
      color: var(--gold);
      border: 1px solid var(--gold-line);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-dark:hover {
      background: #243047;
    }

    /* 간편 메뉴 카드 */
    .menu-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .quick-btn {
      background: var(--bg-card-sub);
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 12px 6px;
      color: var(--text-main);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .quick-btn:hover,
    .quick-btn.active {
      border-color: var(--gold);
      color: var(--gold);
    }

    .quick-icon {
      font-size: 1.2rem;
    }

    /* 간편 이체/실행 박스 */
    .action-card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-label {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--gold);
    }

    .input-box {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 13px;
      color: var(--text-main);
      font-size: 0.92rem;
    }

    .input-box:focus {
      outline: none;
      border-color: var(--gold);
    }

    .row-flex {
      display: flex;
      gap: 8px;
    }

    .btn-run {
      background: var(--gold);
      color: #0b0f17;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 900;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .status-bar {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 0.82rem;
      color: var(--gold);
      font-weight: 700;
    }

    /* 하단 탭 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      background: rgba(21, 28, 40, 0.96);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 10px 8px 14px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .tab-btn.active,
    .tab-btn:hover {
      color: var(--gold);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="badge-hk">HK</div>
        <span class="brand-title">HKWB 간편 뱅킹</span>
      </div>
      <span class="id-chip">ID: ljw2358</span>
    </div>

    <div class="account-card">
      <div class="account-top">
        <span>HKWB 간편 통장</span>
        <span>추천인 ljw2358 · UBI 30%</span>
      </div>
      <div class="balance-row">
        <div class="balance-amount" id="balanceText">1,250,000원</div>
        <button class="btn-transfer-pill" onclick="focusTransfer()">이체</button>
      </div>
      <div class="cta-group">
        <button class="btn-gold" onclick="goInternetBank()">인터넷 뱅킹 진입하기</button>
        <button class="btn-dark" onclick="goInternetBank()">HK-WORLDBANK 열기</button>
      </div>
    </div>

    <div class="menu-card">
      <div class="menu-grid" id="quickMenu"></div>
    </div>

    <div class="action-card">
      <div class="action-label" id="actionTitle">간편 송금</div>
      <input type="text" id="targetInput" class="input-box" placeholder="받는 분 또는 계좌/ID" />
      <div class="row-flex">
        <input type="number" id="moneyInput" class="input-box" value="10000" min="1" placeholder="금액" />
        <button class="btn-run" id="runBtn" onclick="doAction()">확인</button>
      </div>
    </div>

    <div class="status-bar" id="statusBar">
      준비 완료 · 인터넷 뱅킹 진입 시 HK-WORLDBANK로 이동합니다.
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="tab-btn active" onclick="setTab(this, '홈')">
      <span>🏠</span>
      <span>홈</span>
    </button>
    <button class="tab-btn" onclick="goInternetBank()">
      <span>🏦</span>
      <span>인터넷 뱅킹</span>
    </button>
    <button class="tab-btn" onclick="pickMode('예치')">
      <span>💰</span>
      <span>예치</span>
    </button>
    <button class="tab-btn" onclick="pickMode('환전')">
      <span>🌍</span>
      <span>환전</span>
    </button>
  </nav>

  <script>
    const TARGET_URL = "https://ljw2358.github.io/HK-WORLDBANK/";
    let balance = 1250000;
    let mode = "송금";

    const ITEMS = [
      { icon: "💸", name: "송금" },
      { icon: "🏛️", name: "예치" },
      { icon: "🌍", name: "환전" },
      { icon: "🌐", name: "월드뱅크" }
    ];

    function renderQuickMenu() {
      const el = document.getElementById("quickMenu");
      el.innerHTML = ITEMS.map((it) => `
        <button class="quick-btn ${it.name === mode ? "active" : ""}" onclick="pickMode('${it.name}')">
          <span class="quick-icon">${it.icon}</span>
          <span>${it.name}</span>
        </button>
      `).join("");
    }

    function pickMode(name) {
      if (name === "월드뱅크") {
        goInternetBank();
        return;
      }
      mode = name;
      document.getElementById("actionTitle").textContent = "간편 " + name;
      document.getElementById("targetInput").style.display = name === "송금" ? "block" : "none";
      renderQuickMenu();
      setMsg(name + " 메뉴 선택됨");
    }

    function focusTransfer() {
      pickMode("송금");
      document.getElementById("targetInput").focus();
    }

    function doAction() {
      const amt = Number(document.getElementById("moneyInput").value);
      const target = document.getElementById("targetInput").value.trim();

      if (!amt || amt <= 0) {
        setMsg("금액을 입력해 주세요.");
        return;
      }
      if (mode === "송금" && !target) {
        setMsg("받는 분을 입력해 주세요.");
        return;
      }

      if (mode === "송금") {
        balance = Math.max(0, balance - amt);
        setMsg(`${target}님에게 ${amt.toLocaleString()}원 송금 완료`);
      } else {
        balance += amt;
        setMsg(`${amt.toLocaleString()}원 ${mode} 처리 완료`);
      }

      document.getElementById("balanceText").textContent = balance.toLocaleString() + "원";
    }

    function goInternetBank() {
      setMsg("HK-WORLDBANK로 이동합니다...");
      window.location.href = TARGET_URL;
    }

    function setTab(btn, label) {
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      setMsg(label + " 화면");
    }

    function setMsg(text) {
      document.getElementById("statusBar").textContent = text;
    }

    renderQuickMenu();
  </script>
</body>
</html>
