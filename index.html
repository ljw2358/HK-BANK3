<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKWB - 인터넷 뱅킹</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #121929;
            --bg-box: #182238;
            --purple: #9d4edd;
            --gold: #f7d070;
            --gold-bright: #ffe396;
            --text: #ffffff;
            --sub: #a8b3c7;
            --line: #28354f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }

        .wrap {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            border: 1px solid rgba(157, 78, 221, 0.35);
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65), 0 0 24px rgba(157, 78, 221, 0.25);
            overflow: hidden;
        }

        .top-bar {
            padding: 16px 20px;
            background: #0e1422;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
        }

        .user-tag {
            font-size: 12px;
            font-weight: 600;
            color: #e9d5ff;
            background: rgba(157, 78, 221, 0.2);
            border: 1px solid var(--purple);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .lang-box select {
            background: var(--bg-box);
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        .main-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .hero-card {
            background: linear-gradient(145deg, rgba(157, 78, 221, 0.2), rgba(18, 25, 41, 0.95));
            border: 1px solid rgba(247, 208, 112, 0.4);
            border-radius: 14px;
            padding: 20px;
        }

        .hero-meta {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 12px;
            color: var(--sub);
            margin-bottom: 8px;
        }

        .hero-balance {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .hero-balance span {
            color: var(--gold);
        }

        .enter-btn {
            width: 100%;
            padding: 15px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--gold), #e5b636);
            color: #0b0f19;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 18px rgba(247, 208, 112, 0.32);
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .enter-btn:hover {
            background: linear-gradient(90deg, var(--gold-bright), var(--gold));
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(247, 208, 112, 0.48);
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--sub);
            margin-bottom: 10px;
        }

        .section-head small {
            color: #d8b4fe;
            font-size: 11px;
        }

        .mod-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .mod-item {
            background: var(--bg-box);
            border: 1px solid var(--line);
            border-radius: 11px;
            padding: 12px 4px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: border-color 0.2s, background 0.2s, transform 0.2s;
        }

        .mod-item i {
            font-size: 16px;
            color: #c084fc;
        }

        .mod-item span {
            font-size: 11px;
            font-weight: 600;
        }

        .mod-item:hover {
            border-color: var(--purple);
            background: rgba(157, 78, 221, 0.18);
            transform: translateY(-2px);
        }

        .foot-bar {
            padding: 14px 20px;
            background: #080c14;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .sns-group {
            display: flex;
            gap: 10px;
        }

        .sns-link {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-box);
            border: 1px solid var(--line);
            color: var(--sub);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, color 0.2s, border-color 0.2s;
        }

        .sns-link.yt:hover {
            color: #ff4d4d;
            border-color: #ff4d4d;
            transform: translateY(-2px);
        }

        .sns-link.tt:hover {
            color: #22d3ee;
            border-color: #22d3ee;
            transform: translateY(-2px);
        }

        .copy-text {
            font-size: 11px;
            color: var(--sub);
        }

        .modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-box {
            width: 90%;
            max-width: 350px;
            background: var(--bg-card);
            border: 1px solid var(--purple);
            border-radius: 14px;
            padding: 22px;
            text-align: center;
        }

        .modal-box h3 {
            color: var(--gold);
            margin-bottom: 10px;
            font-size: 17px;
        }

        .modal-box p {
            color: var(--sub);
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .modal-close {
            background: var(--purple);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 9px 22px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 440px) {
            .mod-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="top-bar">
            <div class="brand-group">
                <span class="brand-name">HKWB</span>
                <span class="user-tag">ID: ljw2358</span>
            </div>
            <div class="lang-box">
                <select id="langSelect" onchange="changeLang(this.value)">
                    <option value="ko">한국어 (KO)</option>
                    <option value="en">English (EN)</option>
                    <option value="ja">日本語 (JA)</option>
                    <option value="zh">中文 (ZH)</option>
                    <option value="es">Español (ES)</option>
                    <option value="vi">Tiếng Việt (VI)</option>
                </select>
            </div>
        </div>

        <div class="main-body">
            <div class="hero-card">
                <div class="hero-meta">
                    <span>HKWB 간편 잔액</span>
                    <span>추천인 ljw2358 (UBI 우선)</span>
                </div>
                <div class="hero-balance">
                    <span>1,250,000</span> KRW
                </div>
                <button type="button" class="enter-btn" onclick="goBank(event)">
                    <i class="fa-solid fa-building-columns"></i>
                    <span>인터넷 뱅크 진입하기</span>
                </button>
            </div>

            <div>
                <div class="section-head">
                    <span>10대 핵심 모듈</span>
                    <small>Mainnet / Testnet</small>
                </div>
                <div class="mod-grid">
                    <button type="button" class="mod-item" onclick="showMod('지갑 연결')">
                        <i class="fa-solid fa-wallet"></i>
                        <span>지갑 연결</span>
                    </button>
                    <button type="button" class="mod-item" onclick="showMod('송금')">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>송금</span>
                    </button>
                    <button type="button" class="mod-item" onclick="showMod('결제')">
                        <i class="fa-solid fa-credit-card"></i>
                        <span>결제</span>
                    </button>
                    <button type="button" class="mod-item" onclick="showMod('예치')">
                        <i class="fa-solid fa-vault"></i>
                        <span>예치</span>
                    </button>
                    <button type="button" class="mod-item" onclick="showMod('보상')">
                        <i class="fa-solid fa-gift"></i>
                        <span>보상</span>
                    </button>
                    <button type="button" class="mod-item" onclick="showMod('기본소득 (UBI)')">
                        <i class="fa-solid fa-hand-holding-dollar"></i>
                        <span>기본소득</span>
                    </button>
                    <button type="button" class="mod-item" onclick="showMod('스왑')">
                        <i class="fa-solid fa-right-left"></i>
                        <span>스왑</span>
                    </button>
                    <button type="button" class="mod-item" onclick="showMod('덱스 스왑')">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>덱스 스왑</span>
                    </button>
                    <button type="button" class="mod-item" onclick="showMod('LP 스테이킹')">
                        <i class="fa-solid fa-coins"></i>
                        <span>LP 스테이킹</span>
                    </button>
                    <button type="button" class="mod-item" onclick="showMod('파이 수량')">
                        <i class="fa-solid fa-cubes"></i>
                        <span>파이 수량</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="foot-bar">
            <div class="sns-group">
                <a href="https://www.youtube.com/@Hyekong2026" target="_blank" rel="noopener noreferrer" class="sns-link yt" title="YouTube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
                <a href="https://www.tiktok.com/@Hyekong2026" target="_blank" rel="noopener noreferrer" class="sns-link tt" title="TikTok">
                    <i class="fa-brands fa-tiktok"></i>
                </a>
            </div>
            <div class="copy-text">&copy; 2026 HKWB</div>
        </div>
    </div>

    <div class="modal-bg" id="modModal">
        <div class="modal-box">
            <h3 id="modTitle">모듈 안내</h3>
            <p id="modDesc"></p>
            <button type="button" class="modal-close" onclick="closeMod()">확인</button>
        </div>
    </div>

    <script>
        function goBank(e) {
            if (e) e.preventDefault();
            window.location.href = "https://hkwb.world";
        }

        function showMod(name) {
            document.getElementById("modTitle").textContent = name;
            document.getElementById("modDesc").innerHTML =
                "<strong>" + name + "</strong> 모듈을 불러왔습니다.<br>인증 상태 확인 후 이용 가능합니다.";
            document.getElementById("modModal").style.display = "flex";
        }

        function closeMod() {
            document.getElementById("modModal").style.display = "none";
        }

        function changeLang(code) {
            console.log("Language:", code);
        }
    </script>
</body>
</html>
