<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HKWB 뱅킹 시스템</title>
  <style>
    * { box-sizing: border-box; font-family: "Segoe UI", Malgun Gothic, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #14121d;
      color: #f4f2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .panel {
      width: 100%;
      max-width: 560px;
      background: #231f36;
      border: 2px solid #5a4b8c;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #c8bfe8;
    }
    .lang-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select, input {
      padding: 9px 10px;
      border-radius: 6px;
      border: 1px solid #5a4b8c;
      background: #181526;
      color: #fff;
      font-size: 13px;
    }
    select { cursor: pointer; max-width: 240px; }
    input { width: 100%; background: #231f36; font-size: 14px; }
    .balance-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .balance-box {
      background: #181526;
      border: 1px solid #45396e;
      border-radius: 10px;
      padding: 14px;
    }
    .balance-label { font-size: 12px; color: #b2a7d6; }
    .balance-amount { font-size: 22px; font-weight: 700; margin-top: 6px; color: #7ef9c8; }
    .deposit-amount { font-size: 22px; font-weight: 700; margin-top: 6px; color: #ffd166; }
    .grid-menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    button {
      padding: 11px 12px;
      border: none;
      border-radius: 8px;
      background: #362f54;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4b4175; }
    button.primary { background: #2b8a68; font-size: 14px; }
    button.primary:hover { background: #35a37b; }
    button.accent { background: #6b46c1; }
    button.accent:hover { background: #7e57d5; }
    .box {
      background: #181526;
      border: 1px solid #45396e;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
      margin-bottom: 10px;
    }
    .rate-info {
      font-size: 12px;
      color: #d6ceff;
      line-height: 1.5;
      margin-bottom: 10px;
      background: #231f36;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed #5a4b8c;
    }
    .msg { min-height: 20px; font-size: 13px; color: #ffd166; margin-bottom: 8px; }
    ul { list-style: none; padding: 0; margin: 0; max-height: 190px; overflow-y: auto; }
    li {
      padding: 8px 0;
      border-bottom: 1px solid #2e2847;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    li:last-child { border-bottom: none; }
    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #968bc0;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="top-bar">
      <div>
        <strong id="brandTitle">HKWB 시스템</strong> · <span>ID: ljw2358</span>
      </div>
      <div class="lang-wrap">
        <label for="langSelect" id="langLabel">언어</label>
        <select id="langSelect" onchange="changeLanguage(this.value)"></select>
      </div>
    </div>

    <div class="balance-grid">
      <div class="balance-box">
        <div class="balance-label" id="balanceLabel">현재 보유 잔액</div>
        <div class="balance-amount" id="balanceDisplay">1,000,000원</div>
      </div>
      <div class="balance-box">
        <div class="balance-label" id="depositedLabel">총 예치 잔액</div>
        <div class="deposit-amount" id="depositedDisplay">0원</div>
      </div>
    </div>

    <div class="grid-menu">
      <button onclick="focusTransfer()" id="btnMenuTransfer">송금</button>
      <button onclick="claimBasicIncome()" id="btnMenuUbi">기본소득 (+100,000)</button>
      <button onclick="quickDeposit()" id="btnMenuDeposit">빠른 예치 (-50,000)</button>
      <button onclick="makePayment()" id="btnMenuPay">결제 (-30,000)</button>
    </div>

    <div class="box">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <strong id="depositSectionTitle">예치 이율 · 만기 계산 (가변)</strong>
        <button class="accent" onclick="adjustRatesByAsi()" id="btnAsiRate">AGI/ASI 이율 조정</button>
      </div>
      <div class="row-2">
        <select id="termSelect" onchange="updateRatePreview()">
          <option value="6">6개월</option>
          <option value="12" selected>1년 (12개월)</option>
          <option value="24">2년 (24개월)</option>
          <option value="36">3년 (36개월)</option>
        </select>
        <input type="number" id="depositAmountInput" value="100000" min="1000" oninput="updateRatePreview()" />
      </div>
      <div class="rate-info" id="ratePreview"></div>
      <button class="primary" style="width:100%" onclick="executeTermDeposit()" id="btnExecDeposit">선택 조건으로 예치 실행</button>
    </div>

    <div class="box">
      <strong id="transferTitle">실시간 송금</strong>
      <input type="text" id="recipientInput" style="margin-top:8px; margin-bottom:8px;" />
      <input type="number" id="amountInput" min="1" style="margin-bottom:10px;" />
      <div class="msg" id="statusMsg"></div>
      <button class="primary" style="width:100%" onclick="sendMoney()" id="btnSendExec">송금 실행</button>
    </div>

    <div class="box">
      <strong id="historyTitle">거래 내역 / 명세</strong>
      <ul id="historyList"></ul>
    </div>

    <div class="footer">
      <span>© 2026 HKWB</span>
      <span id="txCount">총 0건</span>
    </div>
  </div>

    const state = {
      lang: "ko",
      balance: 1000000,
      deposited: 0,
      ratesByTerm: {
        6: 4.5,
        12: 5.8,
        24: 7.2,
        36: 8.5
      },
      earlyRate: 6.0,
      history: []
    };

    function t(code = state.lang) {
      return I18N[code] || EN_BASE;
    }

    function initLangSelect() {
      const sel = document.getElementById("langSelect");
      sel.innerHTML = LANGUAGES_LIST.map(item =>
        `<option value="${item.code}" ${item.code === state.lang ? "selected" : ""}>${item.name}</option>`
      ).join("");
    }

    function changeLanguage(code) {
      state.lang = code;
      render();
    }

    function formatMoney(num) {
      const loc = state.lang === "ko" ? "ko-KR" : state.lang === "ja" ? "ja-JP" : state.lang === "zh" ? "zh-CN" : "en-US";
      return Math.round(Number(num)).toLocaleString(loc) + t().currencySuffix;
    }

    function addHistory(kind, delta, extra = {}) {
      const now = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      state.history.unshift({ time: now, kind, delta, ...extra });
      render();
    }

    function formatHistoryEntry(item) {
      const dict = t();
      const mapKind = {
        transfer: [dict.typeTransfer, dict.detailTransfer(item.recipient)],
        ubi: [dict.typeUbi, dict.detailUbi],
        deposit: [dict.typeDeposit, dict.detailDeposit(item.months, item.rate)],
        pay: [dict.typePay, dict.detailPay]
      };
      const [label, desc] = mapKind[item.kind] || [item.kind, ""];
      return `[${item.time}] ${label} - ${desc}`;
    }

    function setMessage(text, isError = false) {
      const el = document.getElementById("statusMsg");
      el.style.color = isError ? "#ff6b6b" : "#7ef9c8";
      el.textContent = text;
    }

    function calcInterest(principal, months, annualRate) {
      return principal * (annualRate / 100) * (months / 12);
    }

    function updateRatePreview() {
      const months = Number(document.getElementById("termSelect").value);
      const principal = Math.max(0, Number(document.getElementById("depositAmountInput").value) || 0);
      const rate = state.ratesByTerm[months];
      const interest = calcInterest(principal, months, rate);
      const total = principal + interest;

      document.getElementById("ratePreview").innerHTML = t().rateSummary(
        months,
        rate.toFixed(1),
        formatMoney(interest),
        formatMoney(total),
        state.earlyRate.toFixed(1)
      );
    }

    function adjustRatesByAsi() {
      const delta = Number(((Math.random() * 1.2) - 0.5).toFixed(1));
      [6, 12, 24, 36].forEach((m, idx) => {
        const minR = 2.5 + idx * 0.8;
        const maxR = 7.0 + idx * 1.5;
        const next = Math.min(maxR, Math.max(minR, Number((state.ratesByTerm[m] + delta).toFixed(1))));
        state.ratesByTerm[m] = next;
      });
      state.earlyRate = Math.random() < 0.5 ? 6.0 : 8.5;
      updateRatePreview();
      setMessage(`AGI/ASI 가변 이율 조정 완료 (${delta >= 0 ? "+" : ""}${delta}%p)`);
    }

    function executeTermDeposit() {
      const dict = t();
      const months = Number(document.getElementById("termSelect").value);
      const amount = Number(document.getElementById("depositAmountInput").value);
      const rate = state.ratesByTerm[months];

      if (!Number.isFinite(amount) || amount <= 0) {
        setMessage(dict.errAmount, true);
        return;
      }
      if (amount > state.balance) {
        setMessage(dict.errBalance, true);
        return;
      }

      state.balance -= amount;
      state.deposited += amount;
      addHistory("deposit", -amount, { months, rate: rate.toFixed(1) });
      setMessage(dict.okDeposit(formatMoney(amount), months, rate.toFixed(1)));
    }

    function quickDeposit() {
      document.getElementById("depositAmountInput").value = 50000;
      executeTermDeposit();
    }

    function focusTransfer() {
      document.getElementById("recipientInput").focus();
      setMessage(t().focusPrompt);
    }

    function sendMoney() {
      const dict = t();
      const recipient = document.getElementById("recipientInput").value.trim();
      const amount = Number(document.getElementById("amountInput").value);

      if (!recipient) {
        setMessage(dict.errRecipient, true);
        return;
      }
      if (!Number.isFinite(amount) || amount <= 0) {
        setMessage(dict.errAmount, true);
        return;
      }
      if (amount > state.balance) {
        setMessage(dict.errBalance, true);
        return;
      }

      state.balance -= amount;
      addHistory("transfer", -amount, { recipient });
      setMessage(dict.okTransfer(recipient, formatMoney(amount)));
      document.getElementById("amountInput").value = "";
    }

    function claimBasicIncome() {
      const dict = t();
      const amount = 100000;
      state.balance += amount;
      addHistory("ubi", amount);
      setMessage(dict.okUbi(formatMoney(amount)));
    }

    function makePayment() {
      const dict = t();
      const amount = 30000;
      if (state.balance < amount) {
        setMessage(dict.errBalance, true);
        return;
      }
      state.balance -= amount;
      addHistory("pay", -amount);
      setMessage(dict.okPay(formatMoney(amount)));
    }

    function render() {
      const dict = t();
      document.title = dict.brandTitle;
      document.getElementById("brandTitle").textContent = dict.brandTitle;
      document.getElementById("langLabel").textContent = dict.langLabel;
      document.getElementById("balanceLabel").textContent = dict.balanceLabel;
      document.getElementById("depositedLabel").textContent = dict.depositedLabel;
      document.getElementById("balanceDisplay").textContent = formatMoney(state.balance);
      document.getElementById("depositedDisplay").textContent = formatMoney(state.deposited);

      document.getElementById("btnMenuTransfer").textContent = dict.btnMenuTransfer;
      document.getElementById("btnMenuUbi").textContent = dict.btnMenuUbi;
      document.getElementById("btnMenuDeposit").textContent = dict.btnMenuDeposit;
      document.getElementById("btnMenuPay").textContent = dict.btnMenuPay;

      document.getElementById("depositSectionTitle").textContent = dict.depositSectionTitle;
      document.getElementById("btnAsiRate").textContent = dict.btnAsiRate;
      document.getElementById("btnExecDeposit").textContent = dict.btnExecDeposit;

      document.getElementById("transferTitle").textContent = dict.transferTitle;
      document.getElementById("recipientInput").placeholder = dict.recipientPlaceholder;
      document.getElementById("amountInput").placeholder = dict.amountPlaceholder;
      document.getElementById("btnSendExec").textContent = dict.btnSendExec;

      document.getElementById("historyTitle").textContent = dict.historyTitle;
      document.getElementById("txCount").textContent = dict.txCount(state.history.length);

      updateRatePreview();

      const list = document.getElementById("historyList");
      if (state.history.length === 0) {
        list.innerHTML = `<li><span>${dict.emptyHistory}</span><span>-</span></li>`;
        return;
      }

      list.innerHTML = state.history.map(item => {
        const sign = item.delta > 0 ? "+" : "";
        const color = item.delta > 0 ? "#7ef9c8" : "#ff9f80";
        return `
          <li>
            <span>${formatHistoryEntry(item)}</span>
            <strong style="color:${color}">${sign}${formatMoney(item.delta)}</strong>
          </li>
        `;
      }).join("");
    }

    initLangSelect();
    render();
  </script>
